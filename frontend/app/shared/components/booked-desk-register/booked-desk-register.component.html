<div class="register">
  <div class="top-bar-register">
    <span class="top-bar_title">Booked Desks Register</span>
  </div>
  <div class="register-table">
    <p-table class="table-card" [value]="pagedRows">
      <ng-template pTemplate="header">
        <tr>
          <th class="col-user">User Name</th>
          <th class="col-desk">Desk</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-product>
        <tr>
          <td class="col-user">{{ product.userName }}</td>
          <td class="col-desk">{{ product.desk }}</td>
        </tr>
      </ng-template>
    </p-table>
    <div class="paginator">
      <div
        *ngIf="totalPages > 1"
        class="a-page-indicator a-page-indicator--numbered"
        data-start-index="1"
        data-max-length="2"
        role="navigation"
        aria-label="page indicator numbered"
      >
        <button
          type="button"
          class="a-page-indicator__caret -left"
          aria-label="go to9 previous page"
          (click)="prevPage()"
        ></button>
        <div class="a-page-indicator__container">
          <button
            type="button"
            class="a-page-indicator__indicator -selected"
            data-index="1"
            aria-label="slide 1"
            (click)="goToPage(1)"
            [class.-selected]="currentPage === 1"
          >
            <span>1</span>
          </button>
          <button
            type="button"
            class="a-page-indicator__indicator"
            data-index="2"
            aria-label="slide 2"
            (click)="goToPage(2)"
            [class.-selected]="currentPage === 2"
          >
            <span>2</span>
          </button>

          <button
            type="button"
            class="a-page-indicator__caret -right"
            aria-label="go to next page"
            (click)="nextPage()"
          ></button>
        </div>
      </div>
    </div>
  </div>
</div>
